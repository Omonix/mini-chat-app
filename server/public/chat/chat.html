<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatwings 💬</title>
    <link rel="icon" sizes="32x32" href="../assets/img/logoImg.png" type="image/png" />
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"
      integrity="sha512-11t8Q+vY9JlCrr+PveZKTYJq8n7O09Y5X/pk/aMd3vJugSvu4xOunGEUzaADqL3I8cZKE/pBwwCfXzDkRJh2sQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="./chat.js"></script>
  </head>
  <body>
    <main>
      <form class="formJoin">
        <input
          class="inputTypeOne"
          type="text"
          id="name"
          maxlength="8"
          placeholder="Username..."
          size="5"
          required
        />
        <input
          class="inputTypeOne"
          type="text"
          id="room"
          placeholder="Chat room..."
          size="5"
          required
        />
        <button id="join" type="submit">Join</button>
        <button class="randomer" type="button">Random</button>
      </form>
      <div class="containChat">
        <ul class="roomList"></ul>
        <div class="contentChat">
          <ul class="chatDisplay"></ul>
        </div>
      </div>
      <div class="footer">
        <div class="infoUser">
          <form class="formMsg">
            <textarea class="inputTypeTwo" id="message" placeholder="Message..." autofocus required></textarea>
            <button class="buttonSend" type="submit">Send</button>
          </form>
          <p class="activity"></p>
        </div>
      </div>
    </main>
  </body>
</html>
