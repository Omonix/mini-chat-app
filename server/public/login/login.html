<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWings - Log in 🔐</title>
    <link rel="icon" sizes="32x32" href="../assets/img/logoImg.png" type="image/png" />
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/login.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script defer src="./login.js"></script>
</head>
<body>
    <div>
        <form class="loginForm" action="">
            <input class="inputTypeTwo" id="logUser" type="text" placeholder="Username/Email...">
            <input class="inputTypeTwo" id="logPassword" type="password" placeholder="Password...">
            <div class="containButtonLog">
                <button class="buttonSend" id="logSubmit">Log in</button>
            </div>
        </form>
        <div class="aParent">
            <a href="/" class="backButton">Back</a>
            <a href="/signin" class="linkType">You don't have any account ?</a>
        </div>
    </div>
</body>
</html>
