<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log-in</title>
    <link rel="icon" sizes="32x32" href="../logoImg.png" type="image/png" />
    <link rel="stylesheet" href="../reset.css" />
    <link rel="stylesheet" href="../style.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"
      integrity="sha512-11t8Q+vY9JlCrr+PveZKTYJq8n7O09Y5X/pk/aMd3vJugSvu4xOunGEUzaADqL3I8cZKE/pBwwCfXzDkRJh2sQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="./login.js"></script>
</head>
<body>
    <div>
        <form class="loginForm" action="">
            <input class="inputTypeTwo" id="logUser" type="text" placeholder="Username...">
            <input class="inputTypeTwo" id="logPassword" type="password" placeholder="Password...">
            <div class="containButtonLog">
                <div class="buttonSend" id="logBack">Back</div>
                <button class="buttonSend" id="logSubmit">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
