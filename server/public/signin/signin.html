<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWings - Sign in 📝</title>
    <link rel="icon" sizes="32x32" href="../assets/img/logoImg.png" type="image/png" />
    <link rel="stylesheet" href="../assets/css/reset.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/signin.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"
      integrity="sha512-11t8Q+vY9JlCrr+PveZKTYJq8n7O09Y5X/pk/aMd3vJugSvu4xOunGEUzaADqL3I8cZKE/pBwwCfXzDkRJh2sQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script defer src="./signin.js"></script>
</head>
<body>
    <div class="componentSignin">
        <form class="signinForm" action="">
            <input class="inputTypeTwo" id="signUser" type="text" placeholder="Username...">
            <input class="inputTypeTwo" id="signEmail" type="text" placeholder="Email...">
            <input class="inputTypeTwo" id="signPassword" type="password" placeholder="Password...">
            <div class="containButtonSign">
                <button class="buttonSend" id="signSubmit">Sign in</button>
            </div>
        </form>
        <div class="aParent">
            <a href="/" class="backButton">Back</a>
            <a href="/login" class="linkType">You already have a account ?</a>
        </div>
    </div>
</body>
</html>
